  <script>
    window.__timelines = window.__timelines || {};

    /* ---------------------------------------------------------------------------
       reo: a 1:1 port of app/src/ReoIntro.tsx (+ ReoAvatar geometry) as a pure function of time.
       render(local seconds) sets SVG attributes only; nothing here reads a clock.
       --------------------------------------------------------------------------- */
    const INK = "#141414", PINK = "#FF6B7A", ORANGE = "#FF9A3C";
    const R = 30, RI = 17.7;
    const topBlade = (px, py) => `M${px - R} ${py}A${R} ${R} 0 0 0 ${px} ${py + R}A${RI} ${R} 0 0 1 ${px - RI} ${py}Z`;
    const bottomBlade = (px, py) => `M${px - R} ${py}A${R} ${R} 0 0 1 ${px} ${py - R}A${RI} ${R} 0 0 0 ${px - RI} ${py}Z`;
    const EYE_X = 18, EYE_Y = 2, BROW_LIFT = -44, BROW_SPREAD = 1.14;
    const browTransform = (lift, spread, rot) => `translate(0 ${lift}) translate(0 -9) scale(${spread}) translate(0 9) rotate(${rot})`;
    const LEFT_ARM = [-42, 16, -62, 30], RIGHT_ARM = [42, 10, 62, -8];
    const FOOT = { x: 22, y: 52, rx: 14, ry: 9 };

    const T = {
      slide: [250, 1050], glide: [1050, 1500], turn: [1500, 1950], brows: [1950, 2450], collapse: [1950, 2250],
      eyes: [2100, 2550], feet: [2450, 2800], arms: [2550, 2900], wave: [2900, 3900], shift: [2900, 3400],
      r: [3150, 3550], e: [3300, 3650], o: [3400, 3750], tag: [3650, 4050],
    };
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const seg = (t, [a, b]) => clamp((t - a) / (b - a));
    const lerp = (a, b, p) => a + (b - a) * p;
    const inOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    const outBack = (p, s = 1.70158) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
    const inOutBack = (p, s = 1.70158 * 1.525) =>
      p < 0.5 ? (Math.pow(2 * p, 2) * ((s + 1) * 2 * p - s)) / 2 : (Math.pow(2 * p - 2, 2) * ((s + 1) * (p * 2 - 2) + s) + 2) / 2;

    const W = 600, H = 220, CY = 110, START_X = 99, ERASE_X = 520, END_X = W / 2, END_S = 1.25;
    const LOCK_X = 161, WM_X = 288, WM_BASE = 150, WM_XH = 70, WM_EO_W = 160, WM_RIGHT = WM_X + WM_XH + 6 + WM_EO_W;
    const k = WM_XH / 30;
    const P = (u, v) => `${(WM_X + u * k).toFixed(2)} ${(WM_BASE + (v - 6) * k).toFixed(2)}`;
    const R_PATH = `M${P(30, -24)}A${30 * k} ${30 * k} 0 0 0 ${P(0, 6)}A${30 * k} ${15 * k} 0 0 1 ${P(30, 6 - 15)}Z`;

    const BLADES = [
      { d: topBlade(6, -30), role: "brow", side: 1 },
      { d: bottomBlade(6, 30), role: "brow", side: -1 },
      { d: topBlade(27, -30), role: "eye", side: 1 },
      { d: bottomBlade(27, 30), role: "eye", side: -1 },
    ];

    const svg = document.getElementById("m-svg");
    svg.innerHTML = `
      <defs>
        <linearGradient id="m-gb" gradientUnits="userSpaceOnUse" x1="-55" y1="55" x2="55" y2="-55"><stop class="rs0" offset="0" stop-color="${PINK}"/><stop class="rs1" offset="1" stop-color="${ORANGE}"/></linearGradient>
        <linearGradient id="m-gl" gradientUnits="userSpaceOnUse" x1="-70" y1="-70" x2="70" y2="70"><stop class="rs0" offset="0" stop-color="${PINK}"/><stop class="rs1" offset="1" stop-color="${ORANGE}"/></linearGradient>
        <linearGradient id="m-wm" gradientUnits="userSpaceOnUse" x1="${WM_X}" y1="${WM_BASE - WM_XH}" x2="${WM_RIGHT}" y2="${WM_BASE}"><stop class="rs0" offset="0" stop-color="${PINK}"/><stop class="rs1" offset="1" stop-color="${ORANGE}"/></linearGradient>
        <clipPath id="m-erase"><rect id="m-eraseRect" x="0" y="0" width="${W}" height="${H}"/></clipPath>
      </defs>
      <g clip-path="url(#m-erase)" id="m-reonicG"><text x="190" y="154" font-family="Geist, Inter, sans-serif" font-weight="500" font-size="124" letter-spacing="-2" textLength="361" lengthAdjust="spacingAndGlyphs" fill="${INK}">Reonic</text></g>
      <g id="m-streaks" stroke="${INK}" stroke-linecap="round" stroke-width="3"><line/><line/><line/></g>
      <g id="m-ic">
        <g id="m-feet" fill="url(#m-gl)"><ellipse rx="${FOOT.rx}" ry="${FOOT.ry}"/><ellipse rx="${FOOT.rx}" ry="${FOOT.ry}"/></g>
        <g id="m-armL"><line stroke="url(#m-gl)" stroke-width="15" stroke-linecap="round"/></g>
        <g id="m-armR"><line stroke="url(#m-gl)" stroke-width="15" stroke-linecap="round"/></g>
        <g id="m-body"><rect x="-50" y="-50" width="100" height="100" rx="26" fill="${INK}"/><rect id="m-tint" x="-50" y="-50" width="100" height="100" rx="26" fill="url(#m-gb)" opacity="0"/></g>
        ${BLADES.map((b, i) => `<path id="m-bl${i}" d="${b.d}" fill="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke"/>`).join("")}
        ${[-1, 1].map((s, i) => `<g id="m-eye${i}" opacity="0"><ellipse rx="12.5" ry="16.5" fill="#fff"/><ellipse cx="1.5" cy="1.5" rx="8.6" ry="12" fill="${INK}"/><ellipse cx="4.2" cy="-3.6" rx="2.4" ry="3.6" fill="#fff"/></g>`).join("")}
      </g>
      <g id="m-wmk">
        <path id="m-rp" d="${R_PATH}" fill="url(#m-wm)"/>
        <text id="m-e" font-family="Geist, Inter, sans-serif" font-weight="700" font-size="134" letter-spacing="-3" fill="url(#m-wm)" x="${WM_X + WM_XH + 6}" y="${WM_BASE}">e</text>
        <text id="m-o" font-family="Geist, Inter, sans-serif" font-weight="700" font-size="134" letter-spacing="-3" fill="url(#m-wm)" x="${WM_X + WM_XH + 6 + WM_EO_W / 2}" y="${WM_BASE}">o</text>
        <text id="m-tag" x="${WM_RIGHT}" y="${WM_BASE + 34}" text-anchor="end" font-family="Geist, Inter, sans-serif" font-weight="500" font-size="22" fill="${INK}">by Reonic</text>
      </g>`;
    const $ = (id) => document.getElementById(id);
    const el = {
      eraseRect: $("m-eraseRect"), reonicG: $("m-reonicG"), streaks: $("m-streaks"), ic: $("m-ic"), feet: $("m-feet"),
      armL: $("m-armL"), armR: $("m-armR"), body: $("m-body"), tint: $("m-tint"), wmk: $("m-wmk"), rp: $("m-rp"),
      e: $("m-e"), o: $("m-o"), tag: $("m-tag"), eyes: [$("m-eye0"), $("m-eye1")], bl: BLADES.map((_, i) => $("m-bl" + i)),
    };
    const lines = el.streaks.querySelectorAll("line");
    const feetEl = el.feet.querySelectorAll("ellipse");
    const setArm = (g, sx, sy, ex, ey, angle, visible) => {
      const ln = g.firstElementChild;
      g.setAttribute("display", visible ? "inline" : "none");
      g.setAttribute("transform", `rotate(${angle} ${sx} ${sy})`);
      ln.setAttribute("x1", sx); ln.setAttribute("y1", sy); ln.setAttribute("x2", ex); ln.setAttribute("y2", ey);
    };
    const blinkAt = (idle) => {
      if (idle < 600) return 1;
      const q = ((idle - 600) % 3400) / 170;
      return q < 1 ? 1 - 0.92 * Math.sin(Math.PI * q) : 1;
    };

    // reo takes on each installer's theme: [light stop, dark stop] per site, morphing as the site arrives
    const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const mixHex = (a, b, p) => { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], p)).toString(16).padStart(2, "0")).join(""); };
    const THEMES = { sun: [PINK, ORANGE], A: ["#1F9D55", "#6EE7A8"], B: ["#1D4ED8", "#60A5FA"], C: ["#F59E0B", "#FDE047"] };
    const KEYS = [[0, "sun"], [9.6, "sun"], [9.95, "A"], [10.6, "A"], [10.9, "B"], [11.8, "B"], [12.1, "C"], [13.0, "C"], [13.3, "sun"]];
    const themeAt = (local) => {
      let i = 0;
      while (i < KEYS.length - 1 && local >= KEYS[i + 1][0]) i++;
      const [t0, n0] = KEYS[i], [t1, n1] = KEYS[Math.min(i + 1, KEYS.length - 1)];
      const p = t1 === t0 ? 1 : inOutCubic(clamp((local - t0) / (t1 - t0)));
      return [mixHex(THEMES[n0][0], THEMES[n1][0], p), mixHex(THEMES[n0][1], THEMES[n1][1], p)];
    };
    const stops0 = svg.querySelectorAll(".rs0"), stops1 = svg.querySelectorAll(".rs1");

    // the whole scene-4 timeline in local seconds: the intro clock starts at local 2.0
    const INTRO_AT = 2.0;
    function render(local) {
      const t = Math.max(0, (local - INTRO_AT) * 1000);
      const [c0, c1] = themeAt(local);
      stops0.forEach((n) => n.setAttribute("stop-color", c0));
      stops1.forEach((n) => n.setAttribute("stop-color", c1));
      const wordmarkOut = 1 - inOutCubic(seg(local, [8.0, 8.6])); // wordmark leaves, reo steps to centre
      const reach = outBack(seg(local, [14.2, 15.1]), 1.4);       // both arms reach the two sides

      const pSlide = inOutCubic(seg(t, T.slide));
      const pGlide = inOutCubic(seg(t, T.glide));
      const mix = inOutCubic(seg(t, T.shift)) * wordmarkOut;
      const x = t < T.glide[0] ? lerp(START_X, ERASE_X, pSlide) : lerp(lerp(ERASE_X, END_X, pGlide), LOCK_X, mix);
      const s = lerp(1, END_S, pGlide);
      const dt = 16;
      const speed = clamp((Math.abs(inOutCubic(seg(t + dt, T.slide)) - inOutCubic(seg(t - dt, T.slide))) * (ERASE_X - START_X)) / (2 * dt) / 0.9);

      const pTurnRaw = seg(t, T.turn);
      const rot = 90 * inOutBack(pTurnRaw);
      const hop = -14 * Math.sin(Math.PI * pTurnRaw);
      const tint = inOutCubic(clamp((pTurnRaw - 0.45) / 0.4));

      const pBrow = outBack(seg(t, T.brows));
      const pCollapse = inOutCubic(seg(t, T.collapse));
      const pEyes = seg(t, T.eyes);
      const eyeOpen = pEyes === 0 ? 0 : outBack(pEyes, 2.2);
      const pFeet = outBack(seg(t, T.feet), 2.4);
      const pArms = outBack(seg(t, T.arms), 2.4);
      const pWave = seg(t, T.wave);
      const wave = pWave > 0 && pWave < 1 ? 22 * Math.sin(pWave * Math.PI * 4) * (1 - pWave * 0.6) : 0;
      const blink = blinkAt((local - INTRO_AT) * 1000 - T.tag[1]);

      // Reonic wordmark, erased behind the icon
      el.reonicG.setAttribute("display", t < T.glide[0] ? "inline" : "none");
      el.eraseRect.setAttribute("x", x + 40);
      el.eraseRect.setAttribute("width", Math.max(0, W - (x + 40)));
      // streaks
      el.streaks.setAttribute("opacity", speed > 0.05 ? speed * 0.35 : 0);
      [-26, 0, 26].forEach((dy, i) => {
        lines[i].setAttribute("x1", x - 58 - speed * (60 + i * 18)); lines[i].setAttribute("x2", x - 58);
        lines[i].setAttribute("y1", CY + dy); lines[i].setAttribute("y2", CY + dy);
      });
      el.ic.setAttribute("transform", `translate(${x} ${CY + hop}) scale(${s})`);

      el.feet.setAttribute("display", pFeet > 0 ? "inline" : "none");
      [-1, 1].forEach((sd, i) => { feetEl[i].setAttribute("cx", FOOT.x * sd); feetEl[i].setAttribute("cy", lerp(FOOT.y - 14, FOOT.y, pFeet)); });
      const lex = lerp(LEFT_ARM[2], -104, reach), ley = lerp(LEFT_ARM[3], 22, reach);
      const rex = lerp(RIGHT_ARM[2], 104, reach), rey = lerp(RIGHT_ARM[3], 22, reach);
      setArm(el.armL, LEFT_ARM[0], LEFT_ARM[1], lerp(LEFT_ARM[0], lex, pArms), lerp(LEFT_ARM[1], ley, pArms), 0, pArms > 0);
      setArm(el.armR, RIGHT_ARM[0], RIGHT_ARM[1], lerp(RIGHT_ARM[0], rex, pArms), lerp(RIGHT_ARM[1], rey, pArms), wave * (1 - reach), pArms > 0);

      el.body.setAttribute("transform", `rotate(${rot})`);
      el.tint.setAttribute("opacity", tint);
      BLADES.forEach((b, i) => {
        const p = el.bl[i];
        p.setAttribute("stroke", tint > 0.5 ? "url(#m-gb)" : INK);
        if (b.role === "brow") {
          p.setAttribute("transform", browTransform(BROW_LIFT * pBrow, lerp(1, BROW_SPREAD, pBrow), rot));
          p.setAttribute("opacity", 1);
        } else {
          const bcx = 17 * b.side, bcy = 7, kk = lerp(1, 0.15, pCollapse);
          const cx = lerp(bcx, EYE_X * b.side, pCollapse), cy = lerp(bcy, EYE_Y, pCollapse);
          p.setAttribute("transform", `translate(${cx} ${cy}) scale(${kk}) translate(${-bcx} ${-bcy}) rotate(${rot})`);
          p.setAttribute("opacity", 1 - clamp((pCollapse - 0.55) / 0.45));
        }
      });
      [-1, 1].forEach((sd, i) => {
        el.eyes[i].setAttribute("transform", `translate(${EYE_X * sd} ${EYE_Y}) scale(1 ${Math.max(0.04, eyeOpen * blink)})`);
        el.eyes[i].setAttribute("opacity", clamp(pEyes * 4));
      });

      // wordmark lockup: r grows from its point, e and o rise, "by Reonic"
      const pR = seg(t, T.r), rScale = pR === 0 ? 0 : outBack(pR, 2);
      const rise = (span) => { const p = seg(t, span); return { opacity: clamp(p * 2), dy: 16 * (1 - outBack(p, 2)) }; };
      const pE = rise(T.e), pO = rise(T.o);
      el.wmk.setAttribute("display", pR > 0 && wordmarkOut > 0 ? "inline" : "none");
      el.wmk.setAttribute("opacity", wordmarkOut);
      el.rp.setAttribute("transform", `translate(${WM_X} ${WM_BASE}) scale(${rScale}) translate(${-WM_X} ${-WM_BASE})`);
      el.e.setAttribute("y", WM_BASE + pE.dy); el.e.setAttribute("opacity", pE.opacity);
      el.o.setAttribute("y", WM_BASE + pO.dy); el.o.setAttribute("opacity", pO.opacity);
      el.tag.setAttribute("opacity", inOutCubic(seg(t, T.tag)));
    }

    /* ---- HTML around reo ---- */
    const tl = gsap.timeline({ paused: true });
    // pure-function driver: every seek re-renders reo from the timeline time
    const drv = { v: 0 };
    tl.to(drv, { v: 1, duration: 16, ease: "none", onUpdate: function () { render(this.time()); } }, 0);
    render(0);

    // lockup fades in on blank paper (local 0.8-1.5), holds still until the intro clock starts at 2.0
    tl.fromTo("#m-reo", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.8);

    // tagline under the lockup (rise), leaves with the wordmark
    tl.fromTo("#m-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.3);
    tl.to("#m-sub", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 8.0);

    // drop-in (38.2 -> 40.1): site A rises, reo lifts, then falls into its hero and lands
    tl.fromTo("#m-siteA", { opacity: 1, y: 1100, x: 0 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 8.2);
    tl.fromTo("#m-reo", { y: 0, scale: 1 }, { y: -420, scale: 0.55, duration: 0.9, ease: "power3.inOut" }, 8.3);
    tl.to("#m-reo", { y: -450, duration: 0.3, ease: "power2.out" }, 9.2);   // anticipation
    tl.to("#m-reo", { y: 150, duration: 0.6, ease: "power3.in" }, 9.5);       // the drop
    tl.to("#m-sq", { scaleY: 0.86, scaleX: 1.1, duration: 0.1, ease: "power2.out" }, 10.1); // impact squash
    tl.to("#m-sq", { scaleY: 1, scaleX: 1, duration: 0.45, ease: "back.out(2.6)" }, 10.2);

    // carousel (40.5 -> 43.6): sites slide through the centre, reo stays and takes each theme (render() morphs the colour)
    tl.to("#m-siteA", { x: -1500, duration: 0.7, ease: "power3.inOut" }, 10.5);
    tl.fromTo("#m-siteB", { opacity: 1, x: 1500 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.inOut" }, 10.5);
    tl.to("#m-siteB", { x: -1500, duration: 0.7, ease: "power3.inOut" }, 11.7);
    tl.fromTo("#m-siteC", { opacity: 1, x: 1500 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.inOut" }, 11.7);
    tl.to("#m-siteC", { x: -1500, duration: 0.7, ease: "power3.inOut" }, 12.9);
    tl.fromTo("#m-site", { opacity: 1, x: 1500 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.inOut" }, 12.9);

    // the gap returns (43.6 -> 44.9): Sonnfeld recedes, reo grows and centres, the two sides slide in
    tl.to("#m-site", { scale: 0.55, duration: 1.0, ease: "power3.inOut" }, 13.6);
    tl.to("#m-site", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 14.0); // clears the stage for the two sides
    tl.to("#m-reo", { y: 20, scale: 1.0, duration: 1.0, ease: "power3.inOut" }, 13.6);
    tl.fromTo("#m-bub", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 13.9);
    tl.fromTo("#m-card", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 14.1);
    // hands arrive (render() reaches 14.2-15.1); both sides light up in the sunset edge
    tl.to(["#m-edge1", "#m-edge2"], { opacity: 1, duration: 0.5, ease: "power2.out" }, 14.9);

    window.__timelines["meet"] = tl;
  </script>
</template>
