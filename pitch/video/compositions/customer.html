    <video id="c5-v0" class="clip c5-vid" src="assets/customer-capture.mp4" muted playsinline data-start="0.0" data-duration="2.2667" data-media-start="0.8" data-playback-rate="1.5" data-track-index="0"></video>
    <video id="c5-v1" class="clip c5-vid" src="assets/customer-capture.mp4" muted playsinline data-start="2.2667" data-duration="2.2" data-media-start="6.0" data-playback-rate="2.0" data-track-index="1"></video>

    <video id="c5-v8" class="clip c5-vid" src="assets/customer-capture.mp4" muted playsinline data-start="15.2845" data-duration="5.0769" data-media-start="31.0" data-playback-rate="1.3" data-track-index="8"></video>

  <script>
    window.__timelines = window.__timelines || {};

    const SEG = [{"cap0": 0.8, "cap1": 4.2, "rate": 1.5, "film0": 0.0, "dur": 2.2667}, {"cap0": 6.0, "cap1": 10.4, "rate": 2.0, "film0": 2.2667, "dur": 2.2}, {"cap0": 10.4, "cap1": 11.4, "rate": 1.3, "film0": 4.4667, "dur": 0.7692}, {"cap0": 12.8, "cap1": 17.6, "rate": 2.4, "film0": 5.2359, "dur": 2.0}, {"cap0": 17.6, "cap1": 20.9, "rate": 1.8, "film0": 7.2359, "dur": 1.8333}, {"cap0": 20.9, "cap1": 24.0, "rate": 1.6, "film0": 9.0692, "dur": 1.9375}, {"cap0": 24.6, "cap1": 28.4, "rate": 1.8, "film0": 11.0067, "dur": 2.1111}, {"cap0": 28.4, "cap1": 31.0, "rate": 1.2, "film0": 13.1178, "dur": 2.1667}, {"cap0": 31.0, "cap1": 37.6, "rate": 1.3, "film0": 15.2845, "dur": 5.0769}, {"cap0": 43.1, "cap1": 50.9, "rate": 3.0, "film0": 20.3614, "dur": 2.6}, {"cap0": 50.9, "cap1": 55.0, "rate": 1.5, "film0": 22.9614, "dur": 2.7333}];
    const CAM = [[0.8, 1.0, [720, 450], 0.0], [6.8, 1.6, [1020, 520], 0.8], [18.4, 1.35, [330, 420], 0.6], [21.3, 1.3, [700, 470], 0.9], [27.8, 1.0, [720, 450], 1.0], [31.7, 1.8, [330, 690], 1.0], [34.7, 1.7, [330, 720], 0.6], [36.7, 1.45, [300, 470], 0.8], [43.9, 1.5, [516, 740], 0.25], [52.9, 1.0, [720, 450], 0.9]];
    const PTR = [[1.457, 2.537, [1500, 220], [720.0000228881836, 563.5937652587891]], [6.103, 7.146, [720.0000228881836, 563.5937652587891], [959.2031555175781, 516.9791870117188]], [9.002, 10.095, [959.2031555175781, 516.9791870117188], [1211.35941696167, 516.9791870117188]], [12.937, 13.943, [1211.35941696167, 516.9791870117188], [965.7500305175781, 502.47918701171875]], [16.656, 17.405, [965.7500305175781, 502.47918701171875], [1196.75004196167, 502.47918701171875]], [20.99, 21.878, [1196.75004196167, 502.47918701171875], [1023.4791717529297, 541.7291870117188]], [24.824, 25.937, [1023.4791717529297, 541.7291870117188], [860.1458587646484, 457.97918701171875]], [31.296, 32.764, [860.1458587646484, 457.97918701171875], [325.125, 662.1666870117188]], [34.305, 35.26, [325.125, 662.1666870117188], [215.4010467529297, 784.8646240234375]], [39.873, 40.968, [215.4010467529297, 784.8646240234375], [700, 640]], [43.156, 44.225, [700, 640], [516, 798.6146240234375]], [45.888, 46.831, [516, 798.6146240234375], [516.0000152587891, 665.9479179382324]], [48.976, 49.827, [516.0000152587891, 665.9479179382324], [251.3541717529297, 815.1979370117188]]];
    const DOWNS = [2.841, 7.146, 10.095, 13.943, 17.405, 21.878, 25.937, 35.512, 44.527, 46.831, 50.128];
    const STEPS = [["Usage", 4.0], ["Address", 10.9], ["Car", 21.5], ["Heating", 22.6]];
    const RESULTS_AT = 26.5;
    const TOTAL = 25.695;

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, p) => a + (b - a) * p;
    const inOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    const outBack = (p, s = 1.9) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);

    // film time <-> capture time (the clip is cut into constant-speed segments)
    function capOf(local) {
      for (const s of SEG) if (local < s.film0 + s.dur) return local < s.film0 ? s.cap0 : s.cap0 + (local - s.film0) * s.rate;
      return SEG[SEG.length - 1].cap1;
    }
    function filmOf(cap) {
      for (const s of SEG) if (cap <= s.cap1) return cap < s.cap0 ? s.film0 : s.film0 + (cap - s.cap0) / s.rate;
      const s = SEG[SEG.length - 1]; return s.film0 + s.dur;
    }

    // camera: a move ARRIVES at the key's capture time and takes `dur` film seconds
    const K = CAM.map(([cap, z, c, dur]) => ({ t1: filmOf(cap), z, cx: c[0], cy: c[1], dur }));
    K.forEach((k) => { k.t0 = Math.max(0, k.t1 - k.dur); });
    function camAt(local) {
      let st = K[0];
      let out = { z: st.z, cx: st.cx, cy: st.cy };
      for (let i = 1; i < K.length; i++) {
        const k = K[i], prev = K[i - 1];
        if (local >= k.t1) { out = { z: k.z, cx: k.cx, cy: k.cy }; continue; }
        if (local > k.t0) {
          const p = inOutCubic((local - k.t0) / (k.t1 - k.t0));
          out = { z: lerp(prev.z, k.z, p), cx: lerp(prev.cx, k.cx, p), cy: lerp(prev.cy, k.cy, p) };
        }
        break;
      }
      const tx = clamp(720 - out.z * out.cx, 1440 - 1440 * out.z, 0);
      const ty = clamp(450 - out.z * out.cy, 900 - 900 * out.z, 0);
      return { z: out.z, tx, ty };
    }

    // pointer: the capture's own positions, eased between the moments it left and arrived
    function pointerAt(cap) {
      let pos = PTR.length ? PTR[0][2] : [1500, 220];
      for (const [t0, t1, a, b] of PTR) {
        if (cap < t0) return pos;
        if (cap < t1) { const p = inOutCubic((cap - t0) / (t1 - t0)); return [lerp(a[0], b[0], p), lerp(a[1], b[1], p)]; }
        pos = b;
      }
      return pos;
    }
    const DOWN_FILM = DOWNS.map(filmOf);
    function pressAt(local) {
      let s = 1;
      for (const fd of DOWN_FILM) {
        const dt = local - fd;
        if (dt < 0 || dt > 0.55) continue;
        if (dt < 0.07) s = Math.min(s, lerp(1, 0.84, dt / 0.07));
        else if (dt < 0.2) s = Math.min(s, 0.84);
        else s = Math.min(s, lerp(0.84, 1, clamp(outBack((dt - 0.2) / 0.35), 0, 1.15)));
      }
      return s;
    }

    const camEl = document.getElementById("c5-cam");
    const ptrEl = document.getElementById("c5-ptr");
    const chips = [0, 1, 2, 3].map((i) => document.getElementById("c5-chip" + i));
    const TIP = [9.8, 6.5]; // the arrow's tip inside the 72 px svg
    function render(local) {
      const cam = camAt(local);
      camEl.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.z})`;

      const cap = capOf(local);
      const [px, py] = pointerAt(cap);
      const X = 240 + cam.tx + cam.z * px; // window content origin is (240, 108) in the film
      const Y = 108 + cam.ty + cam.z * py;
      ptrEl.style.transform = `translate(${X}px, ${Y}px) scale(${pressAt(local)}) translate(${-TIP[0]}px, ${-TIP[1]}px)`;

      // step ticker follows the real step marks
      let active = cap < STEPS[0][1] ? -1 : 0;
      STEPS.forEach(([, t], i) => { if (cap >= t) active = i; });
      const done = cap >= RESULTS_AT;
      chips.forEach((c, i) => { c.className = "c5-chip" + (done || i < active ? " done" : i === active ? " active" : ""); });
    }

    const tl = gsap.timeline({ paused: true });
    const drv = { v: 0 };
    tl.to(drv, { v: 1, duration: TOTAL + 1.5, ease: "none", onUpdate: function () { render(this.time()); } }, 0);
    render(0);

    // entrance: the customer's bubble from scene 4 becomes the window (object becomes the world)
    tl.fromTo("#c5-win", { opacity: 0, x: -570, y: 86, scale: 0.28 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.8, ease: "power3.inOut" }, 0);
    tl.fromTo(["#c5-label", "#c5-ticker"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);
    tl.fromTo("#c5-ptr", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.6);

    // hand-off: the plan leaves the customer's window and lands in the planner's inbox
    const H = TOTAL - 0.6;
    tl.to("#c5-ptr", { opacity: 0, duration: 0.25 }, H - 0.3);
    tl.to("#c5-group", { x: -510, scale: 0.6, duration: 1.0, ease: "power3.inOut" }, H);
    tl.fromTo(["#c5-planner", "#c5-plabel"], { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, H + 0.5);
    tl.fromTo("#c5-fly", { opacity: 0, x: 0, y: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, H + 0.55);
    tl.to("#c5-fly", { x: 1020, y: -70, duration: 0.9, ease: "power3.inOut" }, H + 0.85);
    tl.to("#c5-fly", { opacity: 0, duration: 0.2 }, H + 1.7);
    tl.to("#c5-pnone", { opacity: 0, duration: 0.2 }, H + 1.7);
    tl.fromTo("#c5-prow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, H + 1.75);

    window.__timelines["customer"] = tl;
  </script>
