<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Regular.woff2"); font-weight: 400; }
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Medium.woff2"); font-weight: 500; }
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-SemiBold.woff2"); font-weight: 600; }
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Bold.woff2"); font-weight: 700; }

    #root { position: absolute; inset: 0; font-family: "Geist", sans-serif; color: #1b1d20; }
    #root * { box-sizing: border-box; }
    .abs { position: absolute; }

    /* the whole customer side: label, ticker and window move together at the hand-off */
    #c6-group { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
    #c6-label { left: 240px; top: 14px; font-size: 40px; font-weight: 700; letter-spacing: -0.01em; color: #0f9f7a; opacity: 0; }
    #c6-ticker { left: 760px; top: 20px; width: 920px; height: 40px; display: flex; justify-content: flex-end; gap: 10px; opacity: 0; }
    .c6-chip { height: 40px; padding: 0 16px; border-radius: 20px; font-size: 24px; font-weight: 600; line-height: 40px; color: #7fb5a4; background: transparent; border: 2px solid transparent; }
    .c6-chip.active { color: #fff; background: #0f9f7a; }
    .c6-chip.done { color: #0f9f7a; border-color: #bde5d8; background: #eaf8f3; }

    #c6-win { left: 240px; top: 72px; width: 1440px; height: 936px; border-radius: 18px; overflow: hidden; background: #fff; opacity: 0;
      box-shadow: 0 0 0 3px #0f9f7a, 0 30px 80px rgba(15, 159, 122, 0.18); }
    #c6-bar { left: 0; top: 0; width: 1440px; height: 36px; background: #f4f4f5; border-bottom: 1px solid #e4e4e7; }
    .c6-dot { top: 11px; width: 14px; height: 14px; border-radius: 7px; background: #d4d4d8; }
    #c6-url { left: 120px; top: 6px; width: 560px; height: 24px; border-radius: 12px; background: #fff; }
    #c6-view { left: 0; top: 36px; width: 1440px; height: 900px; overflow: hidden; background: #fff; }
    #c6-cam { left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
    .c6-vid { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }

    /* the large pointer, drawn by the film (the capture has no cursor) */
    #c6-ptr { position: absolute; left: 0; top: 0; width: 72px; height: 72px; z-index: 20; opacity: 0; filter: drop-shadow(0 6px 10px rgba(9, 9, 11, 0.28)); transform-origin: 0 0; }

  </style>

  <div id="root" data-composition-id="planner" data-width="1920" data-height="1080">
    <div id="c6-group">
      <div id="c6-label" class="abs">Planner</div>
      <div id="c6-ticker" class="abs">
        <div class="c6-chip" id="c6-chip0">Summary</div><div class="c6-chip" id="c6-chip1">Roof</div><div class="c6-chip" id="c6-chip2">Edit</div><div class="c6-chip" id="c6-chip3">Price</div><div class="c6-chip" id="c6-chip4">Next steps</div><div class="c6-chip" id="c6-chip5">Quote</div>
      </div>
      <div id="c6-win" class="abs" data-layout-allow-overflow>
        <div id="c6-bar" class="abs"><div class="abs c6-dot" style="left:16px"></div><div class="abs c6-dot" style="left:38px"></div><div class="abs c6-dot" style="left:60px"></div><div id="c6-url" class="abs"></div></div>
        <div id="c6-view" class="abs">
          <div id="c6-cam" class="abs">
            <video id="c6-v0" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="0.0" data-duration="2.7143" data-media-start="0.8" data-playback-rate="1.4" data-track-index="0"></video>
            <video id="c6-v1" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="2.7143" data-duration="2.75" data-media-start="6.0" data-playback-rate="1.6" data-track-index="1"></video>
            <video id="c6-v2" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="5.4643" data-duration="2.4375" data-media-start="12.0" data-playback-rate="1.6" data-track-index="2"></video>
            <video id="c6-v3" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="7.9018" data-duration="2.55" data-media-start="16.5" data-playback-rate="2.0" data-track-index="3"></video>
            <video id="c6-v4" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="10.4518" data-duration="3.1579" data-media-start="22.5" data-playback-rate="1.9" data-track-index="4"></video>
            <video id="c6-v5" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="13.6097" data-duration="2.5385" data-media-start="28.5" data-playback-rate="1.3" data-track-index="5"></video>
            <video id="c6-v6" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="16.1481" data-duration="3.7727" data-media-start="33.5" data-playback-rate="2.2" data-track-index="6"></video>
            <video id="c6-v7" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="19.9209" data-duration="1.6111" data-media-start="42.3" data-playback-rate="1.8" data-track-index="7"></video>
            <video id="c6-v8" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="21.532" data-duration="1.2444" data-media-start="45.2" data-playback-rate="4.5" data-track-index="8"></video>
            <video id="c6-v9" class="clip c6-vid" src="assets/planner-capture.mp4" muted playsinline data-start="22.7764" data-duration="4.6808" data-media-start="50.8" data-playback-rate="1.3" data-track-index="9"></video>
          </div>
        </div>
      </div>
    </div>

    <svg id="c6-ptr" viewBox="0 0 44 44" aria-hidden="true"><path d="M6 4 L6 34 L14 27 L19 39 L25 36 L20 25 L31 25 Z" fill="#1b1d20" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/></svg>

  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const SEG = [{"cap0": 0.8, "cap1": 4.6, "rate": 1.4, "film0": 0.0, "dur": 2.7143}, {"cap0": 6.0, "cap1": 10.4, "rate": 1.6, "film0": 2.7143, "dur": 2.75}, {"cap0": 12.0, "cap1": 15.9, "rate": 1.6, "film0": 5.4643, "dur": 2.4375}, {"cap0": 16.5, "cap1": 21.6, "rate": 2.0, "film0": 7.9018, "dur": 2.55}, {"cap0": 22.5, "cap1": 28.5, "rate": 1.9, "film0": 10.4518, "dur": 3.1579}, {"cap0": 28.5, "cap1": 31.8, "rate": 1.3, "film0": 13.6097, "dur": 2.5385}, {"cap0": 33.5, "cap1": 41.8, "rate": 2.2, "film0": 16.1481, "dur": 3.7727}, {"cap0": 42.3, "cap1": 45.2, "rate": 1.8, "film0": 19.9209, "dur": 1.6111}, {"cap0": 45.2, "cap1": 50.8, "rate": 4.5, "film0": 21.532, "dur": 1.2444}, {"cap0": 50.8, "cap1": 55.0, "rate": 1.3, "film0": 22.7764, "dur": 3.2308}];
    const CAM = [[0.8, 1.0, [720, 450], 0.0], [2.4, 1.25, [840, 430], 0.9], [9.0, 1.9, [850, 400], 1.0], [17.0, 1.45, [810, 500], 0.9], [27.0, 1.2, [720, 520], 0.9], [30.4, 1.25, [600, 520], 0.8], [36.0, 1.35, [1100, 500], 0.9], [44.0, 1.3, [740, 560], 0.9], [53.0, 1.2, [720, 600], 0.9]];
    const PTR = [[1.757, 2.891, [1500, 220], [554.7291870117188, 333.07293701171875]], [8.386, 9.591, [554.7291870117188, 333.07293701171875], [875.7936611175537, 498.0172529220581]], [12.203, 13.216, [875.7936611175537, 498.0172529220581], [906.7372035980225, 325.41502952575684]], [13.506, 15.164, [906.7372035980225, 325.41502952575684], [837.5336469635487, 380.618520133408]], [16.607, 17.448, [837.5336469635487, 380.618520133408], [935.1093978881836, 676.4271240234375]], [18.74, 19.099, [935.1093978881836, 676.4271240234375], [935.1093978881836, 676.4271240234375]], [20.265, 20.63, [935.1093978881836, 676.4271240234375], [935.1093978881836, 676.4271240234375]], [22.666, 23.78, [935.1093978881836, 676.4271240234375], [768.2162475585938, 435.8220319747925]], [25.118, 25.879, [768.2162475585938, 435.8220319747925], [1112.29691696167, 676.4271240234375]], [29.83, 30.703, [1112.29691696167, 676.4271240234375], [471.1562805175781, 358.2604179382324]], [35.808, 36.717, [471.1562805175781, 358.2604179382324], [1325.43754196167, 449.76043701171875]], [38.933, 39.86, [1325.43754196167, 449.76043701171875], [1325.43754196167, 596.6771240234375]], [44.266, 45.075, [1325.43754196167, 596.6771240234375], [852.0000610351562, 730.2604179382324]], [50.865, 51.687, [852.0000610351562, 730.2604179382324], [472.83335876464844, 794.1771240234375]]];
    const DOWNS = [13.478, 17.658, 19.179, 20.711, 23.996, 26.093, 37.026, 40.177, 45.076, 51.991];
    const STEPS = [["Summary", 0.33], ["Roof", 6.3], ["Edit", 12.19], ["Price", 27.93], ["Next steps", 33.71], ["Quote", 42.51]];
    const RESULTS_AT = 52.0;
    const TOTAL = 26.007;

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, p) => a + (b - a) * p;
    const inOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    const outBack = (p, s = 1.9) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);

    // film time <-> capture time (the clip is cut into constant-speed segments)
    function capOf(local) {
      for (const s of SEG) if (local < s.film0 + s.dur) return local < s.film0 ? s.cap0 : s.cap0 + (local - s.film0) * s.rate;
      return SEG[SEG.length - 1].cap1;
    }
    function filmOf(cap) {
      for (const s of SEG) if (cap <= s.cap1) return cap < s.cap0 ? s.film0 : s.film0 + (cap - s.cap0) / s.rate;
      const s = SEG[SEG.length - 1]; return s.film0 + s.dur;
    }

    // camera: a move ARRIVES at the key's capture time and takes `dur` film seconds
    const K = CAM.map(([cap, z, c, dur]) => ({ t1: filmOf(cap), z, cx: c[0], cy: c[1], dur }));
    K.forEach((k) => { k.t0 = Math.max(0, k.t1 - k.dur); });
    function camAt(local) {
      let st = K[0];
      let out = { z: st.z, cx: st.cx, cy: st.cy };
      for (let i = 1; i < K.length; i++) {
        const k = K[i], prev = K[i - 1];
        if (local >= k.t1) { out = { z: k.z, cx: k.cx, cy: k.cy }; continue; }
        if (local > k.t0) {
          const p = inOutCubic((local - k.t0) / (k.t1 - k.t0));
          out = { z: lerp(prev.z, k.z, p), cx: lerp(prev.cx, k.cx, p), cy: lerp(prev.cy, k.cy, p) };
        }
        break;
      }
      const tx = clamp(720 - out.z * out.cx, 1440 - 1440 * out.z, 0);
      const ty = clamp(450 - out.z * out.cy, 900 - 900 * out.z, 0);
      return { z: out.z, tx, ty };
    }

    // pointer: the capture's own positions, eased between the moments it left and arrived
    function pointerAt(cap) {
      let pos = PTR.length ? PTR[0][2] : [1500, 220];
      for (const [t0, t1, a, b] of PTR) {
        if (cap < t0) return pos;
        if (cap < t1) { const p = inOutCubic((cap - t0) / (t1 - t0)); return [lerp(a[0], b[0], p), lerp(a[1], b[1], p)]; }
        pos = b;
      }
      return pos;
    }
    const DOWN_FILM = DOWNS.map(filmOf);
    function pressAt(local) {
      let s = 1;
      for (const fd of DOWN_FILM) {
        const dt = local - fd;
        if (dt < 0 || dt > 0.55) continue;
        if (dt < 0.07) s = Math.min(s, lerp(1, 0.84, dt / 0.07));
        else if (dt < 0.2) s = Math.min(s, 0.84);
        else s = Math.min(s, lerp(0.84, 1, clamp(outBack((dt - 0.2) / 0.35), 0, 1.15)));
      }
      return s;
    }

    const camEl = document.getElementById("c6-cam");
    const ptrEl = document.getElementById("c6-ptr");
    const chips = [0, 1, 2, 3, 4, 5].map((i) => document.getElementById("c6-chip" + i));
    const TIP = [9.8, 6.5]; // the arrow's tip inside the 72 px svg
    function render(local) {
      const cam = camAt(local);
      camEl.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.z})`;

      const cap = capOf(local);
      const [px, py] = pointerAt(cap);
      const X = 240 + cam.tx + cam.z * px; // window content origin is (240, 108) in the film
      const Y = 108 + cam.ty + cam.z * py;
      ptrEl.style.transform = `translate(${X}px, ${Y}px) scale(${pressAt(local)}) translate(${-TIP[0]}px, ${-TIP[1]}px)`;

      // step ticker follows the real step marks
      let active = cap < STEPS[0][1] ? -1 : 0;
      STEPS.forEach(([, t], i) => { if (cap >= t) active = i; });
      const done = cap >= RESULTS_AT;
      chips.forEach((c, i) => { c.className = "c6-chip" + (done || i < active ? " done" : i === active ? " active" : ""); });
    }

    const tl = gsap.timeline({ paused: true });
    const drv = { v: 0 };
    tl.to(drv, { v: 1, duration: TOTAL + 1.5, ease: "none", onUpdate: function () { render(this.time()); } }, 0);
    render(0);

    // entrance: the planner window grows out of the placeholder scene 5 ended on (centre 1470,540, scale 0.6)
    tl.fromTo("#c6-win", { opacity: 1, x: 510, y: 0, scale: 0.6 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.85, ease: "power3.inOut" }, 0);
    tl.fromTo(["#c6-label", "#c6-ticker"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);
    tl.fromTo("#c6-ptr", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.6);


    window.__timelines["planner"] = tl;
  </script>
