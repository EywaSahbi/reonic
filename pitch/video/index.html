<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #fdfdfb;
        --ink: #1b1d20;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="46"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>

      <!-- Scenes 1-3: homeowner, installer, the gap, "we wanted to go further" -->
      <div
        id="gap"
        data-composition-id="gap"
        data-composition-src="compositions/gap.html"
        data-start="0"
        data-duration="31"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Reonic becomes reo, dropped onto the installer's website -->
      <div
        id="meet"
        data-composition-id="meet"
        data-composition-src="compositions/meet.html"
        data-start="30"
        data-duration="16"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Voice-over (female voice, Jessica): lines placed at their cues, see voiceover/vo.json -->
      <audio id="vo" src="assets/vo.mp3" data-start="0" data-duration="46" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
